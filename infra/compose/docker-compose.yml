# TestKit infrastructure. Started by `testkit up`, never by hand-picked flags:
# the CLI decides which services to start from the requested profiles and from
# the stores/mocks declared in testkit/services/*.yaml.
#
# Profiles: core | stores | mocks | observability | chaos
# Every image is pinned in versions.env; every port is bound to 127.0.0.1.
# Containers that need special privileges declare them with the label
# testkit.requires (docker.sock, NET_ADMIN, ...); `testkit doctor` checks them.

name: ${TESTKIT_PROJECT:-testkit}

networks:
  default:
    name: ${TESTKIT_NETWORK:-testkit_net}
    labels:
      testkit.managed: "true"

x-managed: &managed
  testkit.managed: "true"

x-hc: &hc
  interval: 3s
  timeout: 5s
  retries: 60
  start_period: 5s

services:
  # ------------------------------------------------------------------ core
  mockhub:
    profiles: [core]
    image: testkit/mockhub:${TESTKIT_VERSION}
    labels: { <<: *managed, testkit.component: mockhub }
    environment:
      MOCKHUB_HTTP_ADDR: ":8081"
      MOCKHUB_SMTP_ADDR: ":2525"
      MOCKHUB_SOCKET_ADDR: ":8082"
      MOCKHUB_SPEC_DIR: /specs
      MOCKHUB_MAIL_RELAY: "mailpit:1025"
    volumes:
      - ../../testkit/mocks:/specs:ro
    ports:
      - "127.0.0.1:${TK_PORT_MOCKHUB}:8081"
      - "127.0.0.1:${TK_PORT_MOCKHUB_SMTP}:2525"
      - "127.0.0.1:${TK_PORT_MOCKHUB_SOCKET}:8082"
    healthcheck:
      <<: *hc
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]

  # ---------------------------------------------------------------- stores
  postgres:
    profiles: [stores]
    image: ${POSTGRES_IMAGE}
    labels: { <<: *managed, testkit.component: postgres }
    environment:
      POSTGRES_USER: ${TK_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TK_POSTGRES_PASSWORD}
      POSTGRES_DB: testkit
    # Durability is traded for speed: data is throw-away and per-run databases are dropped.
    command: ["postgres", "-c", "max_connections=400", "-c", "fsync=off",
              "-c", "synchronous_commit=off", "-c", "full_page_writes=off",
              "-c", "log_min_duration_statement=500"]
    ports: ["127.0.0.1:${TK_PORT_POSTGRES}:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "pg_isready -U ${TK_POSTGRES_USER} -d testkit"]

  kafka:
    profiles: [stores]
    image: ${KAFKA_IMAGE}
    labels: { <<: *managed, testkit.component: kafka }
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${TK_PORT_KAFKA}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # Topics are created per run by TestKit (namespaced by run id), never implicitly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports: ["127.0.0.1:${TK_PORT_KAFKA}:9094"]
    healthcheck:
      <<: *hc
      start_period: 10s
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]

  elasticsearch:
    profiles: [stores]
    image: ${ELASTICSEARCH_IMAGE}
    labels: { <<: *managed, testkit.component: elasticsearch }
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      action.destructive_requires_name: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["127.0.0.1:${TK_PORT_ELASTICSEARCH}:9200"]
    ulimits:
      nofile:
        soft: ${TK_NOFILE_LIMIT}
        hard: ${TK_NOFILE_LIMIT}
    healthcheck:
      <<: *hc
      start_period: 15s
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]

  clickhouse:
    profiles: [stores]
    image: ${CLICKHOUSE_IMAGE}
    labels: { <<: *managed, testkit.component: clickhouse }
    environment:
      CLICKHOUSE_USER: ${TK_CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${TK_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["127.0.0.1:${TK_PORT_CLICKHOUSE}:8123"]
    ulimits:
      nofile:
        soft: ${TK_NOFILE_LIMIT}
        hard: ${TK_NOFILE_LIMIT}
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping >/dev/null"]

  mongo:
    profiles: [stores]
    image: ${MONGO_IMAGE}
    labels: { <<: *managed, testkit.component: mongo }
    # Single-node replica set: transactions and change streams need one.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--quiet"]
    ports: ["127.0.0.1:${TK_PORT_MONGO}:27017"]
    healthcheck:
      <<: *hc
      start_period: 10s
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }\" | grep -q 1 && mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true"]

  redis:
    profiles: [stores]
    image: ${REDIS_IMAGE}
    labels: { <<: *managed, testkit.component: redis }
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:${TK_PORT_REDIS}:6379"]
    healthcheck:
      <<: *hc
      test: ["CMD", "redis-cli", "ping"]

  # One vhost per execution isolates queues. Exact in-flight counts come from
  # `rabbitmqctl list_queues` in this container; the management API is slower
  # (4-5 s) and is only a fallback and a source of rates for evidence.
  rabbitmq:
    profiles: [stores]
    image: ${RABBITMQ_IMAGE}
    labels: { <<: *managed, testkit.component: rabbitmq }
    environment:
      RABBITMQ_DEFAULT_USER: ${TK_RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${TK_RABBITMQ_PASSWORD}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit collect_statistics_interval 500"
    ports:
      - "127.0.0.1:${TK_PORT_RABBITMQ}:5672"
      - "127.0.0.1:${TK_PORT_RABBITMQ_MGMT}:15672"
    tmpfs: ["/var/lib/rabbitmq"]
    healthcheck:
      <<: *hc
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]

  # ----------------------------------------------------------------- mocks
  mailpit:
    profiles: [mocks]
    image: ${MAILPIT_IMAGE}
    labels: { <<: *managed, testkit.component: mailpit }
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: "20000"
    ports:
      - "127.0.0.1:${TK_PORT_MAILPIT}:8025"
      - "127.0.0.1:${TK_PORT_MAILPIT_SMTP}:1025"
    healthcheck:
      <<: *hc
      test: ["CMD", "/mailpit", "readyz"]

  # ----------------------------------------------------------------- chaos
  toxiproxy:
    profiles: [chaos]
    image: testkit/toxiproxy:${TESTKIT_VERSION}
    labels: { <<: *managed, testkit.component: toxiproxy }
    command: ["-host=0.0.0.0", "-port=8474"]
    ports: ["127.0.0.1:${TK_PORT_TOXIPROXY}:8474"]
    healthcheck:
      <<: *hc
      test: ["CMD", "/toxiproxy-cli", "list"]

  # --------------------------------------------------------- observability
  # Containers labelled testkit.requires=docker.sock need the Docker API to
  # discover services under test (metrics, logs, resources). `testkit doctor`
  # checks the capability; without it the profile is skipped and reported.
  prometheus:
    profiles: [observability]
    image: ${PROMETHEUS_IMAGE}
    labels: { <<: *managed, testkit.component: prometheus, testkit.requires: docker.sock }
    user: root   # read access to docker.sock for service discovery
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver   # k6 / OTel push
      - --web.enable-lifecycle
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${TK_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    tmpfs: ["/prometheus"]
    ports: ["127.0.0.1:${TK_PORT_PROMETHEUS}:9090"]
    healthcheck:
      <<: *hc
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]

  loki:
    profiles: [observability]
    image: ${LOKI_IMAGE}
    labels: { <<: *managed, testkit.component: loki }
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ../loki/loki.yaml:/etc/loki/loki.yaml:ro
    tmpfs: ["/loki:uid=10001,gid=10001"]
    ports: ["127.0.0.1:${TK_PORT_LOKI}:3100"]
    healthcheck:
      <<: *hc
      start_period: 10s
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/ready"]

  tempo:
    profiles: [observability]
    image: ${TEMPO_IMAGE}
    labels: { <<: *managed, testkit.component: tempo }
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    tmpfs: ["/var/tempo:uid=10001,gid=10001"]
    ports: ["127.0.0.1:${TK_PORT_TEMPO}:3200"]
    healthcheck:
      <<: *hc
      start_period: 10s
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3200/ready"]

  otel-collector:
    profiles: [observability]
    image: testkit/otel-collector:${TESTKIT_VERSION}   # pinned upstream image + static health probe
    labels: { <<: *managed, testkit.component: otel-collector }
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ../otel-collector/config.yaml:/etc/otel/config.yaml:ro
    healthcheck:
      <<: *hc
      test: ["CMD", "/tkprobe", "http://127.0.0.1:13133/"]

  alloy:
    profiles: [observability]
    image: ${ALLOY_IMAGE}
    labels: { <<: *managed, testkit.component: alloy, testkit.requires: docker.sock }
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy", "/etc/alloy/config.alloy"]
    volumes:
      - ../alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${TK_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    tmpfs: ["/var/lib/alloy"]
    healthcheck:
      <<: *hc
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]

  # Container resources (USE). cAdvisor cannot resolve containers when the
  # engine uses the containerd image store (Docker >= 29 default), so TestKit
  # ships tkstats: Docker stats API -> Prometheus with cAdvisor metric names.
  container-stats:
    profiles: [observability]
    image: testkit/tkstats:${TESTKIT_VERSION}
    labels: { <<: *managed, testkit.component: container-stats, testkit.requires: docker.sock }
    user: root   # read access to docker.sock
    volumes:
      - ${TK_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    healthcheck:
      <<: *hc
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]

  kafka-exporter:
    profiles: [observability]
    image: ${KAFKA_EXPORTER_IMAGE}
    labels: { <<: *managed, testkit.component: kafka-exporter, testkit.needs: kafka }
    command: ["--kafka.server=kafka:9092", "--refresh.metadata=5s", "--offset.show-all"]
    depends_on:
      kafka: { condition: service_healthy }
    healthcheck:
      <<: *hc
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9308/metrics"]

  grafana:
    profiles: [observability]
    image: ${GRAFANA_IMAGE}
    labels: { <<: *managed, testkit.component: grafana }
    environment:
      GF_SECURITY_ADMIN_USER: ${TK_GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${TK_GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # local only (127.0.0.1): locked dashboard links open without login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_RENDERING_SERVER_URL: http://grafana-renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_LOG_LEVEL: warn
      GF_PATHS_DATA: /var/lib/grafana-data
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/etc/grafana/dashboards:ro
    tmpfs: ["/var/lib/grafana-data:uid=472,gid=0"]
    ports: ["127.0.0.1:${TK_PORT_GRAFANA}:3000"]
    healthcheck:
      <<: *hc
      start_period: 10s
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]

  grafana-renderer:
    profiles: [observability]
    image: ${GRAFANA_RENDERER_IMAGE}
    labels: { <<: *managed, testkit.component: grafana-renderer }
    environment:
      ENABLE_METRICS: "false"
      RENDERING_MODE: default
    healthcheck:
      <<: *hc
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/"]
