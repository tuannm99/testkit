# Prometheus for TestKit. Containers of services under test are discovered
# through the Docker API (needs docker.sock) using the labels TestKit puts on
# them; run_id / ns / service / case / trigger become metric labels.
global:
  scrape_interval: 2s
  scrape_timeout: 2s
  evaluation_interval: 5s

scrape_configs:
  # Services under test: 1s scrape (functional cases last a few seconds).
  - job_name: testkit-services
    scrape_interval: 1s
    scrape_timeout: 1s
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 1s
        filters:
          - name: label
            values: ["testkit.metrics=true"]
    relabel_configs:
      - source_labels: [__meta_docker_network_ip, __meta_docker_container_label_testkit_metrics_port]
        regex: (.+);(.+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_docker_container_label_testkit_metrics_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__meta_docker_container_name]
        regex: /?(.*)
        target_label: instance
      - source_labels: [__meta_docker_container_label_testkit_run_id]
        target_label: run_id
      - source_labels: [__meta_docker_container_label_testkit_ns]
        target_label: ns
      - source_labels: [__meta_docker_container_label_testkit_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_testkit_case]
        target_label: case
      - source_labels: [__meta_docker_container_label_testkit_trigger]
        target_label: trigger

  # Container resources (USE) from tkstats; run labels are already set.
  - job_name: container-stats
    static_configs:
      - targets: ["container-stats:8080"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
