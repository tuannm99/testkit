id: TC-JOBS-004
title: Job chưa tới run_at không được xử lý sớm (dùng giờ của database)
requirement: REQ-243
risk: P1
status: approved
owner: qc-lead
service: order-worker
purpose: >
  Job hẹn giờ chỉ được xử lý khi now() của database ≥ run_at; trước đó đơn phải giữ nguyên.
preconditions:
  - Job được chèn với run_at = now() + 4s (giờ database)
vars:
  customer: "cust-o8+{{ .ns }}@shop.test"
input:
  order: { id: o8, customer_email: "{{ .vars.customer }}", amount_cents: 800, currency: USD, status: pending }
trigger: [db-poll]
given:
  postgres.order: ["{{ .input.order }}"]
  mock.payment: [201]
steps:
  - step: postgres.exec
    with: { sql: "INSERT INTO jobs (job_key, order_id, run_at) VALUES ('o8', 'o8', now() + interval '4 seconds')" }
  - step: assert.during
    with:
      for: 2500ms
      expect:
        - { id: C1, check: postgres.order.o8.status, eq: pending, why: "Chưa tới run_at thì chưa xử lý" }
        - { id: C2, check: mock.payment.calls, eq: 0, why: "Chưa gọi cổng thanh toán" }
expect:
  - { id: A1, check: postgres.order.o8.status, eq: paid, why: "Tới run_at thì job được xử lý" }
  - { id: A2, check: postgres.job.o8.attempts, eq: 1, why: "Xử lý một lần, không claim sớm rồi trả lại" }
evidence:
  grafana: [jobs_total, poller]
within: 30s
