id: TC-JOBS-001
title: Ba worker cùng poll bảng job — không trùng, không sót
requirement: REQ-240
risk: P0
status: approved
owner: qc-lead
service: order-worker
purpose: >
  N worker tranh nhau một bảng job (FOR UPDATE SKIP LOCKED + lease): mỗi job được claim và xử lý đúng
  một lần, không job nào bị bỏ sót.
preconditions:
  - 3 instance của worker chạy song song trên cùng database
  - 30 đơn pending và 30 job được chèn cùng lúc; cổng thanh toán chậm 100ms để các worker chồng lấn nhau
input:
  orders: 30
trigger: [db-poll]
sut: { replicas: 3 }
given:
  mock.payment: ["201(delay=100ms)"]
steps:
  - step: postgres.exec
    with:
      sql: >
        INSERT INTO orders (id, customer_email, amount_cents, currency)
        SELECT 'b' || g, 'c' || g || '+{{ .ns }}@shop.test', 100 + g, 'USD' FROM generate_series(1, {{ .input.orders }}) g
  - step: postgres.exec
    with:
      sql: "INSERT INTO jobs (job_key, order_id) SELECT 'b' || g, 'b' || g FROM generate_series(1, {{ .input.orders }}) g"
  - step: trigger.drain
    with: { timeout: 60s }
expect:
  - { id: A1, check: postgres.order.count(status=paid), eq: 30, why: "Không sót: cả 30 đơn đã paid" }
  - { id: A2, check: mock.payment.calls, eq: 30, why: "Không trùng: mỗi đơn gọi cổng thanh toán đúng một lần" }
  - { id: A3, check: mock.payment.idempotency_keys, eq: 30, why: "30 khóa idempotency khác nhau — mỗi đơn một khóa" }
  - { id: A4, check: postgres.job.count(status=done), eq: 30, why: "Mọi job ở trạng thái done" }
  - { id: A5, check: sut.metric(worker_poll_claimed_total), eq: 30, why: "Tổng số lần claim của 3 worker = 30: không job nào bị claim hai lần" }
  - { id: A6, check: sut.metric(worker_poll_rescued_total), eq: 0, why: "Không job nào phải cứu do hết lease" }
evidence:
  grafana: [jobs_total, poller, payment_calls_total]
within: 60s
