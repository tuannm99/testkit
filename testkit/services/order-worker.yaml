# Service descriptor: everything TestKit needs to know about one service.
# Adding a service = adding a file like this one. No core change.
#
# Values under env: are Go templates rendered per test case, so each case gets
# its own namespace (database, topics, consumer group, index, mock base URL):
#   {{ .NS }}  {{ .RunID }}  {{ pgdsn }}  {{ brokers }}  {{ topic "x" }}
#   {{ group "x" }}  {{ index "x" }}  {{ mock "x" }}  {{ smtp }}  {{ es }}
#   {{ amqp }}  {{ rkey "x" }}
apiVersion: testkit/v1
kind: Service
name: order-worker
description: Reference worker — pays orders from Kafka or a DB job table, calls the payment API, writes Postgres (+outbox) and Elasticsearch, mails the customer.
owner: team-payments

image:
  name: testkit/reference-worker
  tag: dev
  test_tag: dev-failpoint            # built with -tags failpoint (crash / mutation tests)
  build:
    context: ../../reference-worker
    test_args: { GO_TAGS: failpoint }

ports: { http: 8080 }
health: { port: http, path: /healthz, timeout: 60s }
metrics: { port: http, path: /metrics }

stores:
  postgres:
    migrations: ../../reference-worker/migrations/postgres
    snapshot: [orders, jobs, outbox, payment_events]
  kafka:
    topics:
      - { name: orders, partitions: 3 }
      - { name: orders.dlq, partitions: 1 }
      - { name: order-events, partitions: 3 }
    groups: [order-worker]
  elasticsearch:
    indices:
      orders: { mappings: ../../reference-worker/es/orders.json }
      order-history: { mappings: ../../reference-worker/es/order-history.json }
  clickhouse:
    migrations: ../../reference-worker/migrations/clickhouse
    snapshot: [order_events]
  mongo:
    snapshot: [audit]
  redis:
    snapshot: true
    queues:
      - { name: orders-stream, kind: stream, group: order-worker, dlq: orders-stream-dlq }
      - { name: orders-list, kind: list, processing: "orders-list:processing", dlq: orders-list-dlq }
  rabbitmq:
    queues:
      - { name: orders, dlq: orders.dlq }

mocks:
  payment:
    kind: http
    openapi: ../mocks/payment.openapi.yaml   # must live under mocks_dir (mounted into the Mock Hub)
    operation: createCharge
    api_version: "2024-06-01"
    verified_at: "2026-10-01"
    verified_against: docs                  # no provider sandbox: self-faked from the provider's OpenAPI
    description: Payment gateway (charges, Idempotency-Key required)
  psp:
    kind: webhook
    api_version: "2024-06-01"
    verified_at: "2026-10-01"
    verified_against: docs
    secret: test-only-webhook-secret     # throw-away value, also given to the service
    description: Payment provider calling back the service (refund events)
  partner:
    kind: socket
    protocol: ws
    description: Partner receiving order notifications over WebSocket (acks by id, heartbeat ping/pong)
  mail:
    kind: smtp
    description: Customer notification mail (Mock Hub SMTP with fault injection, relayed to Mailpit)

triggers:
  kafka:
    topic: orders
    group: order-worker
    dlq: orders.dlq                  # dead-letter topic (logical name)
    key: "{{ .job.order_id }}"
    value: '{"job_id":"{{ .job.id }}","order_id":"{{ .job.order_id }}","enqueued_at":"{{ .now }}"}'
  rabbitmq:
    queue: orders
    key: "{{ .job.id }}"
    value: '{"job_id":"{{ .job.id }}","order_id":"{{ .job.order_id }}","enqueued_at":"{{ .now }}"}'
  redis:
    queue: orders-stream
    key: "{{ .job.id }}"
    value: '{"job_id":"{{ .job.id }}","order_id":"{{ .job.order_id }}","enqueued_at":"{{ .now }}"}'
  db-poll:
    table: jobs
    sql: "INSERT INTO jobs (job_key, order_id) VALUES ('{{ .job.id }}', '{{ .job.order_id }}')"
    drained: "SELECT count(*) FROM jobs WHERE status IN ('queued', 'running')"
    dead: "SELECT count(*) FROM jobs WHERE status = 'dead'"

entities:
  order:
    postgres: { table: orders, key: id }
    elasticsearch: { table: orders, key: _id }
  order_history:
    elasticsearch: { table: order-history, key: _id }
  order_event:
    clickhouse: { table: order_events, key: event_id }
  audit:
    mongo: { table: audit, key: _id }
  job:
    postgres: { table: jobs, key: job_key }
  payment_event:
    postgres: { table: payment_events, key: event_id }

failpoints:
  no_retry: payment errors are treated as permanent (retry disabled)
  no_idempotency_key: the Idempotency-Key header is not sent
  skip_paid_check: an already paid order is charged again
  skip_mail_guard: the at-most-once mail guard is bypassed
  crash_after_db_commit: the process exits right after the paid transaction commits
  commit_before_process: Kafka offset committed before processing
  es_ignore_bulk_errors: _bulk item errors (HTTP 200, errors=true) are ignored
  use_worker_clock: job due time compared with the worker clock instead of the DB clock
  poll_busy_loop: the poller does not back off when the job table is empty
  ch_no_dedup_token: ClickHouse inserts without insert_deduplication_token (retries duplicate rows)
  mongo_dup_is_error: Mongo duplicate key (E11000, already recorded) is treated as a failure
  skip_cache_invalidate: the Redis status cache is not refreshed when a refund arrives
  ws_no_resend: unacked notifications are not resent after a reconnect
  ws_no_heartbeat: a silent (half-open) WebSocket connection is never detected
  drop_dead_letters: a message that cannot be processed is acknowledged and dropped instead of dead-lettered
  outage_is_failure: a store outage (database unreachable) consumes delivery attempts and can dead-letter the job

env:
  SERVICE_NAME: order-worker
  TESTKIT_RUN_ID: "{{ .RunID }}"
  HTTP_ADDR: ":8080"
  DATABASE_URL: "{{ pgdsn }}"
  TRIGGERS: kafka,dbpoll,rabbitmq,redis
  RABBITMQ_URL: "{{ amqp }}"
  RABBITMQ_QUEUE: orders
  REDIS_QUEUE: '{{ rkey "orders-stream" }}'
  REDIS_QUEUE_KIND: stream
  REDIS_QUEUE_GROUP: order-worker
  REDIS_QUEUE_DLQ: '{{ rkey "orders-stream-dlq" }}'
  KAFKA_BROKERS: "{{ brokers }}"
  KAFKA_TOPIC: '{{ topic "orders" }}'
  KAFKA_GROUP: '{{ group "order-worker" }}'
  KAFKA_DLQ_TOPIC: '{{ topic "orders.dlq" }}'
  OUTBOX_TOPIC: '{{ topic "order-events" }}'
  PAYMENT_URL: '{{ mock "payment" }}'
  PAYMENT_MAX_BACKOFF: 5s
  ES_URL: "{{ es }}"
  ES_INDEX: '{{ index "orders" }}'
  SMTP_ADDR: "{{ smtpmock }}"
  MAIL_FROM: "orders+{{ .NS }}@shop.test"       # the Mock Hub SMTP server reads the namespace from it
  ES_HISTORY_INDEX: '{{ index "order-history" }}'
  CH_URL: "{{ ch }}"
  CH_DATABASE: "{{ database }}"
  CH_USER: "{{ chuser }}"
  CH_PASSWORD: "{{ chpass }}"
  MONGO_URI: "{{ mongo }}"
  MONGO_DB: "{{ database }}"
  REDIS_ADDR: "{{ redis }}"
  REDIS_PREFIX: "{{ keyprefix }}"
  PARTNER_WS_URL: '{{ mocksocket "partner" }}'
  WS_HEARTBEAT: 500ms
  POLL_LEASE: 6s
  ORDER_LEASE: 10s
  WEBHOOK_SECRET: '{{ mocksecret "psp" }}'

# Trigger perf executor: how to create the business objects of a batch of job
# ids and how to read when each one completed (end-to-end latency per job).
perf:
  fixture: >
    INSERT INTO orders (id, customer_email, amount_cents, currency)
    SELECT '{{ .prefix }}' || g, 'p' || g || '+{{ .ns }}@shop.test', 100 + g, 'USD' FROM generate_series({{ .from }}, {{ .to }}) g
  completion: >
    SELECT id, extract(epoch FROM updated_at) AS done FROM orders WHERE status = 'paid' AND id LIKE '{{ .prefix }}%'

# Dependencies a case may route through Toxiproxy (chaos.proxies in the case).
# {{ proxy }} is the toxiproxy:<port> allocated for the execution.
chaos:
  proxies:
    postgres:
      upstream: postgres:5432
      env: { DATABASE_URL: "postgres://{{ pguser }}:{{ pgpass }}@{{ proxy }}/{{ database }}?sslmode=disable" }
    payment:
      upstream: mockhub:8081
      env: { PAYMENT_URL: "http://{{ proxy }}/ns/{{ .NS }}/payment" }
    redis:
      upstream: redis:6379
      env: { REDIS_ADDR: "{{ proxy }}" }
    elasticsearch:
      upstream: elasticsearch:9200
      env: { ES_URL: "http://{{ proxy }}" }

# Cross-store consistency checked by `reconcile.<name>.*` and written as evidence.
reconcile:
  paid_orders:
    description: Every paid order exists once in Postgres, the search index, the history index, analytics and the audit log
    sources:
      - { store: postgres, sql: "SELECT id FROM orders WHERE status IN ('paid', 'refunded')" }
      - { store: elasticsearch, index: orders, field: order_id }
      - { store: elasticsearch, index: order-history, term: { status: paid }, field: order_id }
      - { store: clickhouse, sql: "SELECT order_id FROM order_events WHERE type = 'order.paid'" }
      - { store: mongo, collection: audit, filter: { type: order.paid }, field: order_id }

# Evidence panels: name -> Grafana panel. Raw data is fetched with the panel's
# own queries (variables interpolated), so image and numbers always match.
panels:
  throughput:       { dashboard: tk-order-worker, panel_id: 1 }
  error_rate:       { dashboard: tk-order-worker, panel_id: 2 }
  p95_latency:      { dashboard: tk-order-worker, panel_id: 3 }
  e2e_latency:      { dashboard: tk-order-worker, panel_id: 4 }
  payment_calls:    { dashboard: tk-order-worker, panel_id: 5 }
  payment_latency:  { dashboard: tk-order-worker, panel_id: 6 }
  in_flight:        { dashboard: tk-order-worker, panel_id: 7 }
  poller:           { dashboard: tk-order-worker, panel_id: 8 }
  # cumulative panels: the right evidence for short functional cases
  payment_calls_total: { dashboard: tk-order-worker, panel_id: 9 }
  jobs_total:          { dashboard: tk-order-worker, panel_id: 10 }
  latency_since_start: { dashboard: tk-order-worker, panel_id: 11 }
  side_effects_total:  { dashboard: tk-order-worker, panel_id: 12 }
  container_cpu:    { dashboard: tk-run, panel_id: 1 }
  container_memory: { dashboard: tk-run, panel_id: 2 }
  consumer_lag:     { dashboard: tk-run, panel_id: 3 }
  log_levels:       { dashboard: tk-run, panel_id: 5 }

# The standard case pack (testkit gen --service order-worker): the service's own business
# is described once here; duplicate delivery, poison message, crash, dependency fault, out of
# order and steady load are generated for every trigger above. See docs/bo-case-chuan.md.
conformance:
  owner: qc-lead
  requirement: REQ-STD
  within: 45s
  evidence: [jobs_total, side_effects_total, payment_calls_total]

  # ONE job's business data. {{ .key }} = k1, k2... (unique per job); {{ .ns }} stays a runtime value.
  given:
    postgres.order:
      - { id: "{{ .key }}", customer_email: "cust-{{ .key }}+{{ .ns }}@shop.test", amount_cents: 1500, currency: USD, status: pending }
  shared:
    mock.payment: [201]
  # Names for per-job values a check cannot spell (mail.to(customer_k1).count).
  vars:
    "customer_{{ .key }}": "cust-{{ .key }}+{{ .ns }}@shop.test"

  # What holds once a job is complete.
  done:
    - { check: "postgres.order.{{ .key }}.status", eq: paid, why: "Đơn {{ .key }} được thanh toán" }
    - { check: "es.order.{{ .key }}.status", eq: paid, why: "Đơn {{ .key }} đã được index" }
    - { check: "postgres.order.count(status=paid)", per_job: 1, why: "Cả {{ .jobs }} đơn đều được thanh toán, không đơn nào bị mất" }
  # Side effects that must happen exactly once per job.
  effects:
    - { check: mock.payment.succeeded, per_job: 1, why: "Trừ tiền đúng một lần cho mỗi đơn (không trừ trùng)" }
    - { check: "mail.to(customer_{{ .key }}).count", eq: 1, why: "Khách của đơn {{ .key }} nhận đúng một mail" }
    - { check: kafka.order-events.count, per_job: 1, why: "Đúng một sự kiện order.paid cho mỗi đơn (outbox, không mất, không ma)" }
    - { check: "clickhouse.order_event.count(order_id={{ .key }})", eq: 1, why: "Đơn {{ .key }} có đúng một dòng phân tích" }

  patterns:
    duplicate-delivery:
      copies: 3
      mutations:
        # Triệu chứng khác nhau theo trigger (Kafka/RabbitMQ/Redis: trừ tiền lại; db-poll: job thứ hai chết vào `dead`),
        # nên không chỉ định assertion: case phải đỏ ở bất kỳ assertion nào.
        - { failpoint: skip_paid_check, title: "Bỏ kiểm tra đơn đã paid (giao trùng bị xử lý lại)" }
    poison-message:
      body: "{not json"
      db-poll:
        sql: "INSERT INTO jobs (job_key, order_id) VALUES ('poison-{{ .ns }}', '')"
      mutations:
        - { failpoint: drop_dead_letters, title: "Message không xử lý được bị bỏ thay vì chuyển DLQ", expect_red: [poison] }
    crash-mid-job:
      failpoint: crash_after_db_commit
      log: "failpoint: crashing after db commit"
      restart: "on-failure:3"
      mutations:
        # Giao lại sau crash khi đơn đã paid: không có kiểm tra thì job kẹt mãi (không bao giờ xong).
        - { failpoint: skip_paid_check, title: "Bỏ kiểm tra đơn đã paid (job giao lại sau crash kẹt, không bao giờ xong)", expect_red: [trigger.backlog, es.order] }
    dependency-fault:
      jobs: 100
      rate: 10
      max_recovery: 30s
      faults:
        - proxy: postgres
          fault: down
          for: 5s
          mutations:
            - { failpoint: outage_is_failure, title: "Sự cố DB bị tính là lần xử lý thất bại (job có thể vào DLQ)", expect_red: [dlq] }
        - proxy: payment
          fault: reset_peer
          for: 5s
          mutations:
            - { failpoint: no_retry, title: "Tắt retry (lỗi tạm thời của cổng thanh toán bị coi là vĩnh viễn)", expect_red: [dlq] }
    out-of-order:
      jobs: 3
      mutations:
        - { failpoint: skip_paid_check, title: "Bỏ kiểm tra đơn đã paid (job phát lại muộn kẹt, không bao giờ xong)", expect_red: [trigger.backlog] }
    steady-load:
      rate: 20
      duration: 20s
      warmup: 5s
      repeat: 3
      thresholds: { p95_ms: 1500, error_rate: 0.01, min_throughput: 15, max_dropped: 0 }
