  - { id: A3, check: mock.payment.idempotency_keys, eq: 1, why: "Cả 2 lần gọi dùng cùng một Idempotency-Key" }
  - { id: A4, check: mock.payment.schema_errors, eq: 0, why: "Request đúng hợp đồng OpenAPI (Idempotency-Key là bắt buộc)" }
evidence:
