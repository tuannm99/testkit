id: TC-ORDER-030
title: Cổng thanh toán lỗi 500 một lần rồi thành công — retry giữ nguyên Idempotency-Key
requirement: REQ-232
risk: P0
status: draft
owner: qc-lead
service: order-worker
generated:
  by: draft-tool
  at: "2026-10-04T20:00:00Z"
